# upload4 专用 Apache vhost（.htaccess 生效的前提是 AllowOverride All）
# 集成方式示例（php:8-apache 官方镜像）：
#   拷贝本文件到 /etc/apache2/sites-available/000-default.conf 后重启 apache
#   或在全局 apache2.conf 中将 <Directory /var/www/> 的 AllowOverride 改为 All
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All          # ← 关键：允许 .htaccess 覆盖配置（题目漏洞的前提）
        Require all granted
    </Directory>
</VirtualHost>
