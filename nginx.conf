# CTF Web Arena — 单站点统一入口（通用路由版）
# 门禁模型：题目 location 一条通用正则 ^/[a-z][a-z0-9]*\d → auth_request → Flask /_auth；
#           403 统一 302 到 /api/gate（无 cookie 先建会话，未解锁渲染锁定页）。
# 题目分发：全部交给 /var/www/challenges/_router.php（清单 _routes.json 由
#           tools/gen_challenges_json.py 生成），新增题目无需改本文件。
# 例外路由：
#   /backup.zip   recon2 的泄露产物（构建期生成于 /var/www/artifacts）
#   :8090         cors1 攻击页（独立源 = 端口不同，SameSite 演示需要）
#   :8307         xxe2 OOB 监听平台（代理到 Flask /oob/*，模拟 Collaborator）

# ---------- 8090：cors 攻击者站点（独立 Origin）----------
server {
    listen 8090 default_server;
    server_name _;
    root /var/www/challenges/cors/cors1/attacker;
    index attack.html;
    location / { try_files $uri $uri/ =404; }
}

# ---------- 8307：xxe2 OOB 监听平台（Flask /oob/*）----------
server {
    listen 8307 default_server;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:8000/oob/;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
}

# ---------- 主站 ----------
server {
    listen 80 default_server;
    server_name _;
    root /var/www/portal;
    index index.html;

    client_max_body_size 12m;

    # 302 用相对 Location（避免代理/非标准端口下绝对地址丢端口）
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 512;

    # 题目页统一注入页内 flag 表单的 JSON 提交助手（绑定 form[action="/api/verify"]）
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<script src="/assets/ffverify.js"></script></head>';

    error_page 403 = @ctf_gate;

    # ---------- 服务端门禁子请求 ----------
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Remote $remote_addr;
    }
    location @ctf_gate {
        return 302 /api/gate?next=$uri;
    }

    # ---------- 校验 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # ---------- 题目通用路由（<字母前缀+数字> = 题目id）----------
    location ~ ^/[a-z][a-z0-9]*\d {
        auth_request /_auth;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/challenges/_router.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # ---------- recon2 泄露产物：站点根目录的整站备份 ----------
    location = /backup.zip {
        root /var/www/artifacts;
    }

    # ---------- 门户与静态资产 ----------
    location / {
        try_files $uri $uri/ =404;
    }
}
